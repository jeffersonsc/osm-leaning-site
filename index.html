<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Sound Meter · Visual Guide</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .lang-picker {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lang-picker .wrap {
      max-width: 600px;
      text-align: center;
    }
    .lang-picker h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .lang-picker h1 span {
      color: var(--terra);
    }
    .lang-picker .tagline {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 48px;
    }
    .lang-picker .langs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .lang-picker .lang-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px 20px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.15s;
      display: block;
    }
    .lang-picker .lang-card:hover {
      border-color: var(--terra);
      transform: translateY(-2px);
    }
    .lang-picker .lang-card .flag {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .lang-picker .lang-card .name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .lang-picker .lang-card .desc {
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="lang-picker">
    <div class="wrap">
      <h1>Open Sound Meter<br><span>Visual Guide</span></h1>
      <p class="tagline">Choose your language · Escolha seu idioma</p>
      <div class="langs">
        <a href="pt/index.html" class="lang-card">
          <div class="flag">🇧🇷</div>
          <div class="name">Português</div>
          <div class="desc">Guia visual completo em português brasileiro</div>
        </a>
        <a href="en/index.html" class="lang-card">
          <div class="flag">🇬🇧</div>
          <div class="name">English</div>
          <div class="desc">Complete visual guide in English</div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
